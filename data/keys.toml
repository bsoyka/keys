# Source of truth for what each key is. scripts/build.py reads this plus the
# key/cert files under public/ and generates keys.txt, index.html, keys.json and ssh.txt.
# Fingerprints are never typed here: they're computed from the files.
#
# private_key: where the private key is, in public-safe terms (no paths). The
# exact files are listed in the RESTORE.md files in ~/doomsday. Keep this honest:
# it's how I (and anyone else) can tell whether a key can still sign or decrypt.

[owner]
name = "Benjamin Soyka"
email = "ben@bensoyka.com"
site = "https://keys.bensoyka.com"

# ---------------------------------------------------------------- PGP

[[pgp]]
file = "pgp/BC4876BDC8AB5AB8C9CB81659497E30583D68D89.asc"
private_key = "Held. Everyday parts on a hardware security key; full key in an offline, passphrase-protected backup."
status = "current"
title = "Main PGP key"
use = """
My main key. Use it to send me encrypted messages or to check things I've
signed: emails, files, Git commits, and this list. Its everyday parts live on
a hardware security key and can't be copied off it; the master part is kept
offline. Its authentication part doubles as my SSH key."""
wkd = "ben@bensoyka.com"
alias = "pgp.asc"   # stable URL for "my current key"
ssh_subkey = "4CD451BCEC8DB32C03B5026CC83BA4E193E4483E"

[[pgp]]
file = "pgp/13ABAA107960069C2D1BF9D0D1937DCDF9A524BC.asc"
private_key = "Held, in an offline, passphrase-protected backup."
status = "current"
title = "Wikipedia PGP key"
use = """
A separate key for Wikipedia-related correspondence as User:Bsoyka, also
published on my Wikipedia user page. Rarely used, but still active."""

[[pgp]]
file = "pgp/0CA7CC16A64B68F3048EE8FEA5E726D5A65228EA.asc"
private_key = "Held offline, encrypted to my main key, only to decrypt old messages."
status = "revoked"
title = "Previous PGP key (2021-2026)"
use = """
Replaced on 2026-08-21 as routine maintenance, not because anything went
wrong. Signatures it made before then are still genuine. Don't encrypt to it."""

[[pgp]]
file = "pgp/91FA69646625ECAB5DE4A69737799464147A3418.asc"
private_key = "Held offline, passphrase-protected, only to decrypt old messages."
status = "revoked"
title = "Original PGP key (2020-2025)"
use = "Revoked 2025-07-19. Listed for completeness."

# ---------------------------------------------------------------- X.509

[[x509]]
file = "pki/root.crt"
private_key = "Held offline, encrypted to my main PGP key."
crl = "pki/root.crl"
role = "root"
status = "current"
title = "My root certificate authority"
use = """
The one certificate to trust. It only certifies my own certificate
authorities, its key is kept offline, and nothing below it can create further
authorities. Trust it once and every document I sign will show as valid,
including after I renew my signing certificate."""

[[x509]]
file = "pki/personal-ca.crt"
private_key = "Held offline, encrypted to my main PGP key."
crl = "pki/personal-ca.crl"
role = "ca"
status = "current"
title = "My personal certificate authority"
use = """
Sits under the root and issues the certificates I personally sign with. Its
key is also kept offline. You don't need to trust it separately."""

[[x509]]
file = "pki/certs/docsign-primary.crt"
role = "signing"
status = "current"
title = "Document signing certificate"
private_key = "On a hardware security key only. It can't be copied off, so there is no backup; if the hardware is lost I issue a new certificate."
use = """
What I sign PDFs with. Its private key was created on a hardware security
key and can't be copied off it; the attestation file proves that, checkable
against the hardware maker's own certificate authority."""
attestation = "pki/attestation/docsign-primary-attest.crt"
attestation_intermediate = "pki/attestation/docsign-primary-f9.crt"

[[x509]]
file = "pki/certs/docsign-backup.crt"
role = "signing"
status = "current"
title = "Document signing certificate (backup)"
private_key = "On a second hardware security key, kept somewhere safe. Can't be copied off."
use = """
The same as above, on my backup hardware key, so I can still sign if the
first one is lost. Signatures from either are equally mine."""
attestation = "pki/attestation/docsign-backup-attest.crt"
attestation_intermediate = "pki/attestation/docsign-backup-f9.crt"

[[x509]]
file = "pki/retired/2026-08-24-p256-signing.crt"
status = "retired"
title = "Earlier signing certificate (Aug–Nov 2026)"
private_key = "Was on a hardware security key, but a software copy existed and was shared outside my control on 2026-11-09. Removed from the hardware and all copies deleted."
use = """
Used to sign documents from August to November 2026, with its key stored on
hardware. A software copy of the key existed and was shared outside my control
on 2026-11-09, so it's retired as of then. Documents I sent before that are
genuine; if in doubt, ask me."""

# ---------------------------------------------------------------- Keyoxide

[keyoxide]
title = "Keyoxide profile"
private_key = "Held offline, encrypted to my main PGP key."
use = """
Links my domains and accounts to my main PGP key. Keyoxide checks each link
live, in both directions."""

# ---------------------------------------------------------------- legacy

[[legacy]]
title = "Keybase"
private_key = "Keybase's own device keys, not part of this setup."
use = """
My old Keybase proof stays up so existing checks don't break, but Keybase
isn't maintained anymore. My accounts are now linked to my key on Keyoxide."""
