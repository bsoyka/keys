# Source of truth for what each key is. scripts/build.py reads this plus the
# key/cert files under public/ and generates keys.txt, index.html, WKD and ssh.txt.
# Fingerprints are never typed here: they're computed from the files.

[owner]
name = "Benjamin Soyka"
email = "ben@bensoyka.com"
site = "https://keys.bensoyka.com"

# ---------------------------------------------------------------- PGP

[[pgp]]
file = "pgp/BC4876BDC8AB5AB8C9CB81659497E30583D68D89.asc"
status = "current"
title = "Main PGP key"
use = """
My main key. Use it to send me encrypted messages or to check things I've
signed: emails, files, Git commits, and this list. Its everyday parts live on
a hardware security key and can't be copied off it; the master part is kept
offline. Its authentication part doubles as my SSH key."""
wkd = "ben@bensoyka.com"
alias = "pgp.asc"   # stable URL for "my current key"
ssh_subkey = "4CD451BCEC8DB32C03B5026CC83BA4E193E4483E"

[[pgp]]
file = "pgp/13ABAA107960069C2D1BF9D0D1937DCDF9A524BC.asc"
status = "current"
title = "Wikipedia PGP key"
use = """
A separate key for Wikipedia-related correspondence as User:Bsoyka, also
published on my Wikipedia user page. Rarely used, but still active."""

[[pgp]]
file = "pgp/0CA7CC16A64B68F3048EE8FEA5E726D5A65228EA.asc"
status = "revoked"
title = "Previous PGP key (2021-2026)"
use = """
Replaced on 2026-08-21 as routine maintenance, not because anything went
wrong. Signatures it made before then are still genuine. Don't encrypt to it."""

[[pgp]]
file = "pgp/91FA69646625ECAB5DE4A69737799464147A3418.asc"
status = "revoked"
title = "Original PGP key (2020-2025)"
use = "Revoked 2025-07-19. Listed for completeness."

# ---------------------------------------------------------------- X.509

[pki]
root = "pki/root.crt"
crl = "pki/root.crl"
root_use = """
My own certificate authority. It only issues certificates for me, can't
create other authorities, and its key is kept offline. Trust it once and
every document I sign will show as valid, including after I renew my
signing certificate."""

[[x509]]
file = "pki/certs/docsign-current.crt"
status = "current"
title = "Document signing certificate"
use = """
What I sign PDFs with. Its private key was created on a hardware security
key and can't be copied off it; the attestation file proves that, checkable
against the hardware maker's own certificate authority."""
attestation = "pki/attestation/docsign-current-attest.crt"
attestation_intermediate = "pki/attestation/docsign-current-f9.crt"

[[x509]]
file = "pki/retired/2026-10-30-selfsigned-9c.crt"
status = "retired"
title = "Earlier signing certificate (Oct–Nov 2026)"
use = """
Used for a few documents before my certificate authority existed. Those
signatures are genuine; it's simply been replaced."""

[[x509]]
file = "pki/compromised/2026-08-24-p256-test.crt"
status = "compromised"
title = "P-256 test certificate (Aug 2026)"
use = """
A test certificate whose private key was later exposed. Never used for
anything real. Treat anything signed with it as not from me."""

# ---------------------------------------------------------------- legacy

[[legacy]]
title = "Keybase"
use = """
My old Keybase proof stays up so existing checks don't break, but Keybase
isn't maintained anymore and this page replaces it."""
